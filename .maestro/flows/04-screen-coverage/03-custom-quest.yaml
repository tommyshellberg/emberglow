appId: com.vaedros.unquest
---
# =============================================================================
# CUSTOM QUEST TEST
# =============================================================================
# Creates a custom quest via the single-step form (name -> Start), verifies the
# pending-quest screen appears, then cancels (we don't wait for completion, so
# the quest duration is irrelevant).
# =============================================================================

- tapOn:
    id: 'new-quest-tab'

- tapOn: 'Create Custom Quest'

# The form's name field (placeholder "go for a run") has autoFocus, so we type
# into it directly. A non-empty name is the ONLY requirement to enable Start
# (canContinue = questName.trim().length > 0 — use-custom-quest-form.ts:39).
- extendedWaitUntil:
    visible:
      id: 'start-custom-quest-button'
    timeout: 10000
- inputText: 'Maestro Test Quest'
- hideKeyboard

# Categories are fitness/work/self-care/social/learning/creative/household/
# outdoors/other (there is NO 'exercise'). Selecting one is optional for Start
# but we pick fitness for a complete quest.
- tapOn:
    id: 'category-option-fitness'

- tapOn:
    id: 'start-custom-quest-button'

# =============================================================================
# VERIFY QUEST STARTED (pending-quest screen), then cancel
# =============================================================================
- extendedWaitUntil:
    visible:
      id: 'quest-card'
    timeout: 10000
- assertVisible: 'Lock your phone'

- tapOn: 'Cancel Quest'
