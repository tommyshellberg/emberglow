appId: com.vaedros.unquest
---
# =============================================================================
# SETTINGS SCREEN — SMOKE TEST
# =============================================================================
# Render-only check. Deviates from the original design's "toggle the theme"
# test: no theme feature exists in this codebase (verified against
# settings-store.ts and settings.tsx). The real local-only toggles (Daily
# Reminder, Streak Warning) sit behind the Notifications switch, which
# triggers a native OS permission dialog on first grant — judged too flaky
# for this suite's determinism goal. Revisit if a theme feature, or a
# top-level local-only toggle, is added later.
# =============================================================================

- tapOn:
    id: 'settings-tab'

- assertVisible:
    id: 'settings-screen'
- assertVisible: 'Settings'
- assertVisible: 'Account'
- assertVisible: 'Notifications'

- tapOn:
    id: 'profile-tab'
