appId: com.vaedros.unquest
---
# =============================================================================
# ONBOARDING E2E TEST - PART 2: QUEST COMPLETION VERIFICATION
# =============================================================================
# This test verifies quest completion after the quest-duration wait:
#   1. Unlock phone
#   2. Verify quest completion screen
#   3. Check exact XP gained (50 XP)
#   4. Verify level (Level 1)
#   5. Tap Continue to reach the signup screen (signup itself is phase 2)
#
# Prerequisites:
#   - Part 1 must have completed successfully
#   - The runner must have waited for the quest duration
#   - Quest should be completed
# =============================================================================

# =============================================================================
# UNLOCK PHONE AND VERIFY QUEST COMPLETION
# =============================================================================
- pressKey: "Lock"

# Swipe to unlock
- swipe:
    start: 50%, 80%
    end: 50%, 20%
    duration: 500

# =============================================================================
# QUEST COMPLETION SCREEN - EXACT VALUE ASSERTIONS
# =============================================================================
- extendedWaitUntil:
    visible: 'Quest Complete'
    timeout: 10000

# Verify exact XP reward
- assertVisible:
    text: '50'
    below: 'XP Gained'

# Verify level (should still be Level 1 after first quest)
- assertVisible: 'Level 1'

- tapOn: 'Continue'

# =============================================================================
# ONBOARDING COMPLETE
# =============================================================================
# First quest verified (Level 1, 50 XP). Tapping Continue lands on the
# quest-completed-signup screen ("Claim Your Legend"). Signup itself is
# phase 2 — see flows/02-signup/.
