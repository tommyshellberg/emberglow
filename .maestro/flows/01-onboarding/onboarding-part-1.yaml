appId: com.vaedros.unquest
---
# =============================================================================
# ONBOARDING E2E TEST - PART 1: UP TO QUEST LOCK
# =============================================================================
# Guest onboarding, from a wiped app container up to locking the phone:
#   1. Welcome screen
#   2. Character creation (hero name, then the character carousel)
#   3. App introduction (welcome beat, then the notifications beat)
#   4. First quest — hold the ember to commit
#   5. Cancel the pending quest and re-commit (edge case)
#   6. Lock the phone to start the quest
#
# Anchored on testIDs, not copy: the redesign rewrote nearly every string on
# these screens (mostly capitalisation) and Maestro's text matching is
# case-sensitive, so copy anchors break on every visual pass.
#
# After this flow, run-tests.sh waits out the quest duration before running
# part 2. The onboarding quest is built client-side from AVAILABLE_QUESTS
# (`data/quests.ts`), whose dev override is 1 minute — verified on device: the
# quest run's expiresAt is startedAt + 60s. The server's 2-minute story override
# (quest-template.controller.js) applies only to quests fetched from the
# next-available endpoint, which this one is not.
# =============================================================================

# =============================================================================
# ENSURE THE DEVICE IS UNLOCKED
# =============================================================================
# Part 1 ends by locking the phone, so a re-run (or a run after part 2) starts
# against a locked, display-asleep simulator. Launching the app in that state
# leaves it suspended and the JS bundle never loads. A swipe does NOT wake it;
# pressing Home does, and it is idempotent — on an already-unlocked device it
# just drops to the home screen, which launchApp immediately leaves.
- pressKey: 'Home'

- launchApp:
    clearState: true

# =============================================================================
# DEV CLIENT ONLY — GET PAST EXDevLauncher
# =============================================================================
# clearState wipes the whole app container, which on a debug/dev-client build
# also wipes EXDevLauncher's remembered dev-server URL and its "seen the
# developer menu" flag. Both screens therefore reappear on every run. A release
# build (what `pnpm e2e` runs against) has no dev launcher at all: neither
# condition matches and both blocks are skipped.
- runFlow:
    when:
      visible: 'DEVELOPMENT SERVERS'
    commands:
      - tapOn: 'http://localhost:8081'
      # The developer-menu sheet is raised once per container, i.e. every run
      # that goes through the picker. It only appears once Metro has served the
      # bundle, and clearState wiped the cached copy — that reload has taken
      # over a minute here, so this wait is deliberately generous. It only
      # applies to dev-client runs; the whole block is skipped on release.
      # Maestro text selectors are FULL-string regex matches, not substring
      # matches — hence the explicit wildcards.
      - extendedWaitUntil:
          visible: '.*This is the developer menu.*'
          timeout: 120000
      - tapOn: 'Continue'
      # "Continue" only dismisses the explainer copy — the dev menu itself
      # stays up over the app until its close button is tapped.
      - tapOn: 'Close'

# =============================================================================
# WELCOME SCREEN
# =============================================================================
- extendedWaitUntil:
    visible:
      id: 'get-started-button'
    timeout: 60000
- tapOn:
    id: 'get-started-button'

# =============================================================================
# CHARACTER CREATION — STEP 1: HERO NAME
# =============================================================================
- extendedWaitUntil:
    visible:
      id: 'character-name-input'
    timeout: 15000
- tapOn:
    id: 'character-name-input'
- inputText: 'MaestroHero'

# The Continue button is at y≈841 and the keyboard covers everything below
# y≈586, so tapping it while the keyboard is up reports success and lands on
# the keyboard instead (it typed a stray space into the hero name). Dismiss via
# the keyboard's own Return key — `hideKeyboard` raises iOS's native "Enable
# Dictation?" alert.
- tapOn:
    id: 'Return'

# The Continue button is also disabled until the name validates, and a tap on a
# disabled button still reports success — the carousel assert below is what
# proves the step advanced.
- tapOn:
    id: 'character-step-continue'

# =============================================================================
# CHARACTER CREATION — STEP 2: CHARACTER CAROUSEL
# =============================================================================
# Same testID as step 1 (the label is step-dependent), so this is a second
# consecutive tap on 'character-step-continue'.
- extendedWaitUntil:
    visible:
      id: 'character-carousel'
    timeout: 15000
- tapOn:
    id: 'character-step-continue'

# =============================================================================
# APP INTRODUCTION — WELCOME BEAT
# =============================================================================
# Creating the character posts a provisional user to the API, so allow for a
# round trip here.
- extendedWaitUntil:
    visible:
      id: 'intro-continue'
    timeout: 30000
- tapOn:
    id: 'intro-continue'

# =============================================================================
# APP INTRODUCTION — NOTIFICATIONS BEAT
# =============================================================================
# Deliberately taking "Not now" (intro-skip-notifications): the Allow path
# raises the native OS permission dialog, whose copy and timing vary by iOS
# version. That path is covered separately — see SHE-24.
- extendedWaitUntil:
    visible:
      id: 'intro-skip-notifications'
    timeout: 15000
- tapOn:
    id: 'intro-skip-notifications'

# =============================================================================
# FIRST QUEST — HOLD TO COMMIT
# =============================================================================
# The quest is started by a DecisionSlider, not a button: an 800ms hold on the
# orb, plus a 650ms settle before onCommit fires. tapOn can never start it, and
# a green longPressOn proves nothing on its own — every hold below is followed
# by a positive assert on a post-commit anchor.
- extendedWaitUntil:
    visible:
      id: 'wake-up-button-orb'
    timeout: 20000

- longPressOn:
    id: 'wake-up-button-orb'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'lock-instructions'
    timeout: 15000

# =============================================================================
# PENDING QUEST — CANCEL AND RE-COMMIT (EDGE CASE)
# =============================================================================
# The back arrow cancels rather than navigating back; clearing pendingQuest
# drops the resolver to the onboarding first-quest screen.
- tapOn:
    id: 'pending-quest-back-button'
- extendedWaitUntil:
    visible:
      id: 'wake-up-button-orb'
    timeout: 15000
- assertNotVisible:
    id: 'lock-instructions'

- longPressOn:
    id: 'wake-up-button-orb'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'lock-instructions'
    timeout: 15000

# =============================================================================
# START QUEST BY LOCKING THE PHONE
# =============================================================================
# There is no start button: the quest begins when the native lock listener
# fires (QuestTimer.onPhoneLocked).
- pressKey: 'Lock'

# =============================================================================
# END OF PART 1
# =============================================================================
# Phone is locked and the quest is running. The runner waits out the quest
# duration before running part 2.
