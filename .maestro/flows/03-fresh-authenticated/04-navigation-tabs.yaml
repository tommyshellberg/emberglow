appId: com.vaedros.unquest
---
# =============================================================================
# TAB NAVIGATION TEST
# =============================================================================
# Tests navigation between all five bottom tabs via their testIDs, verifying a
# stable anchor on each destination screen.
# =============================================================================

- tapOn:
    id: 'new-quest-tab'
- assertVisible:
    id: 'home-header'

# --- Journal tab ---
# The quest-history list loads async ("Loading your quest history..."), so wait
# for the completed quest to appear rather than asserting immediately.
- tapOn:
    id: 'journal-tab'
- assertVisible: 'Journal'
- extendedWaitUntil:
    visible: 'Wake up'
    timeout: 10000

# --- Map tab ---
# The map screen's title is the map name. There is currently a single map
# ('map-1' → 'Vaedros Kingdom', src/app/data/maps.ts), so the title is
# deterministic. extendedWaitUntil absorbs the brief 'Loading map...' state.
- tapOn:
    id: 'map-tab'
- extendedWaitUntil:
    visible: 'Vaedros Kingdom'
    timeout: 10000

# --- Profile tab ---
- tapOn:
    id: 'profile-tab'
- assertVisible: 'MaestroHero'
- assertVisible:
    id: 'level-display'
- assertVisible: '100 XP'

# --- Settings tab ---
- tapOn:
    id: 'settings-tab'
- assertVisible:
    id: 'settings-screen'
- assertVisible: 'Account'
- assertVisible: 'Notifications'

# --- Back to home ---
- tapOn:
    id: 'new-quest-tab'
- assertVisible:
    id: 'home-header'
