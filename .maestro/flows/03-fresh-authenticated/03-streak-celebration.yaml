appId: com.vaedros.unquest
---
# =============================================================================
# STREAK CELEBRATION TEST
# =============================================================================
# Verifies the Day-2 streak, handling both cases: the streak-celebration
# screen may still be showing, or it may already have been dismissed (in which
# case we verify the streak count in the profile).
#
# Prerequisites:
#   - Second quest completed; user on a Day 2 streak.
# =============================================================================

# Case 1: the streak-celebration screen is showing — dismiss it.
# Detected by its 'Quest Streak' eyebrow. The screen shows 'day streak!' text
# and a Continue button whose accessibility label is 'Continue to home screen'.
- runFlow:
    when:
      visible: 'Quest Streak'
    commands:
      - assertVisible: 'day streak'
      - tapOn: 'Continue'

# Case 2: streak celebration already passed (or was just dismissed) — verify
# the streak count in the profile.
- runFlow:
    when:
      visible:
        id: 'home-header'
    commands:
      - tapOn:
          id: 'profile-tab'
      - assertVisible:
          id: 'streak-display'
      - assertVisible:
          text: '2'
      - assertVisible: 'Day Streak'
      - tapOn:
          id: 'new-quest-tab'
