appId: com.vaedros.unquest
---
# =============================================================================
# SECOND QUEST — PART 2: UNLOCK AND VERIFY THE REWARD
# =============================================================================
# Picks up exactly where part 1 stopped — phone locked, quest-1b running:
#   1. Unlock the phone, which is what makes QuestTimer settle the quest
#   2. Clear the two screens that intercept the completion (see below)
#   3. Verify the quest COMPLETED (not failed), on the right quest, for the
#      right reward
#   4. Continue back to the home screen for the rest of phase 03
#
# Prerequisites:
#   - part 1 ran to its `pressKey: 'Lock'` and left the device locked
#   - the runner waited out the quest duration — 135s, see part 1's header
#
# TWO SCREENS CAN INTERCEPT THE COMPLETION, IN THIS ORDER. Neither exists in the
# onboarding equivalent of this flow. Both are consequences of this being the
# second quest — but only the first one is certain:
#
#   1. The streak celebration — ALWAYS. navigation-state-resolver.ts:157-161
#      gives it Priority 1, above the quest result. quest-store.ts:188-228 shows
#      it when the streak is >= 1 and it has not been shown today — and it reads
#      `dailyQuestStreak` from the state snapshot taken BEFORE updateStreak, so
#      quest 1 (pre-value 0) does not trigger it and quest 2 (pre-value 1)
#      does. That is why onboarding part 2 never saw it.
#   2. The branching-storyline announcement, ON TOP of the streak screen —
#      SOMETIMES. Its own precondition is met (`hasCompletedFirstBranch` comes
#      from the completed quest-1b part 1 just ran), but a once-per-day cap
#      shared with every other announcement decides whether it actually
#      presents, and the signup flow normally spends that cap first. Full
#      explanation, and the conditional handling, at "INTERCEPTOR 2 OF 2" below.
#
# WHY THERE IS NO XP/LEVEL ASSERTION HERE. `profile-xp-level` and
# `profile-xp-xp` live in the profile tab and are owned by
# 01-profile-verification.yaml, which asserts the ACCUMULATED total
# (`LEVEL 2` · `9 / 150 XP` = 100 + 9, over L3's 250 − L2's 100 — both values
# confirmed on device at this point in the chain). The `+9 XP` badge below
# asserts a different thing — the reward this quest paid — so repeating the
# profile pair here would mean two flows failing for one bug without covering
# anything new. One caveat for the runner: for 01-profile-verification's
# `9 / 150 XP` to be the true expectation it must run AFTER this pair, not
# before it as the filename ordering implies.
# =============================================================================

# =============================================================================
# UNLOCK THE PHONE
# =============================================================================
# Part 1 ends with `pressKey: 'Lock'`, so this flow starts against a locked
# device whose display has gone to sleep across the 135s wait. A sleeping
# display takes one Home press to wake and a second to dismiss the lock screen
# (there is no passcode), but on an already-awake device the first press
# dismisses it outright — hence the guard rather than two blind presses. Two
# blind presses would background the app whenever the first one was enough.
#
# Both misfires of the guard are loud, not silent: if it fails to fire the
# device stays locked, and if it fires wrongly the app drops to the
# springboard. Either way the completion assert below finds nothing.
- pressKey: 'Home'
- runFlow:
    when:
      visible:
        id: 'lockscreen-date-view'
    commands:
      - pressKey: 'Home'

# =============================================================================
# INTERCEPTOR 1 OF 2 — THE STREAK CELEBRATION
# =============================================================================
# Unlocking settles the quest, and the resolver's Priority 1 sends the app
# here rather than straight to the quest result. Waiting on the button rather
# than on the "QUEST STREAK" eyebrow keeps this off copy; the button is
# `streak-continue-button`, a11y label "Continue to home screen".
#
# Generous timeout: settling the quest round-trips to the server first.
#
# This flow only drives the screen past — 03-streak-celebration.yaml owns the
# assertions about what it says.
- extendedWaitUntil:
    visible:
      id: 'streak-continue-button'
    timeout: 45000

# =============================================================================
# INTERCEPTOR 2 OF 2 — THE BRANCHING-STORYLINE ANNOUNCEMENT SHEET (CONDITIONAL)
# =============================================================================
# Whatever appears here has to be cleared BEFORE the streak button is tapped,
# not after: the sheet occupies [0,368][430,1018] and `streak-continue-button`
# sits at [16,811][414,865], entirely underneath it. A tap on the covered button
# reports success and does nothing — the same iOS occlusion trap as the LogBox
# toast, which is why the wait above is on the button but the tap is below the
# dismissal.
#
# -----------------------------------------------------------------------------
# THE SHEET IS CONDITIONAL NOW. IT USED TO BE DETERMINISTIC.
# -----------------------------------------------------------------------------
# This block used to wait for the sheet unconditionally, on the grounds that
# finishing quest-1b sets `hasCompletedFirstBranch` and the home effect then
# presents the branching announcement 1500ms later. That is still true of the
# announcement's own precondition — but it is no longer what decides whether the
# sheet appears, because of a coupling to a completely different flow:
#
#   CROSS-FLOW COUPLING — `02-signup/02-verify-authenticated.yaml` (commit
#   `8c5795f`) now dismisses the narrator-voice announcement on every run. That
#   announcement has NO precondition (`announcement-store.ts` —
#   `getAnnouncementToShow`, narratorVoice is "always eligible if unseen"), so it
#   is the one that presents at the first post-signup home settle. Presenting is
#   what stamps the cap: `markAnnouncementShown()` runs inside the present timer
#   (`index.tsx`), not on dismissal. And the FIRST thing
#   `getAnnouncementToShow` does is return null for the rest of the calendar day
#   once `lastAnnouncementShownAt` falls on today.
#
# So:
#   SAME-DAY CHAIN (every normal suite run) — the signup flow burned today's one
#   announcement slot, so NO sheet appears here. This is the branch the suite
#   takes in practice, and it is the branch verified green on device
#   (2026-08-10, Release build).
#   CROSS-DAY CHAIN (chain built one day, this flow run the next) — the day slot
#   is fresh, branching outranks narratorVoice in the priority list, and the
#   sheet DOES appear here.
#
# Hence a bounded conditional instead of an unconditional wait. The shape is
# copied from the narrator block in `8c5795f`, which is the proven precedent in
# this suite for exactly this problem:
#   - The `optional: true` wait is what removes the race the old comment worried
#     about. A bare `runFlow: when:` could be evaluated before the 1500ms timer
#     fires, skip, and let the sheet materialise in time to swallow the next tap.
#     Waiting first means the guard only decides after the sheet has had its
#     window; `optional: true` is what lets the absent branch pass instead of
#     failing the flow.
#   - 15s: the present timer is 1500ms and the sheet animates in over
#     `durations.slow`, so ~2s covers it — 15s is roughly seven times that, and
#     it is the same number `8c5795f` already proved on this device against the
#     same timer.
#
# DISMISSED BY ITS OWN BUTTON NOW, NOT BY A COORDINATE TAP. The old comment said
# sheet contents were invisible to Maestro on iOS (SHE-26) and dismissed via a
# `50%,20%` tap on the backdrop, while noting that a tap drifting one button up
# would hit "Restart at Branching Point" and silently wipe story progress
# mid-suite. Both halves are stale:
#   - SHE-26 is FIXED on this branch (`1a69599` — `accessible={false}` on the
#     BottomSheetModal, so descendants stop being collapsed into one element).
#   - `221d9b7` gave this sheet's two buttons testIDs precisely so the suite
#     could close it.
# `branching-announcement-continue` is the non-destructive one ("Continue
# Current Journey"): its handler only sets `setHasSeenBranchingAnnouncement(true)`
# and dismisses. Naming it by id cannot drift onto the destructive button, which
# is strictly safer than any coordinate.
#
# The wait and the guard name the BACKDROP rather than the button, on purpose.
# The backdrop is the thing that actually occludes the streak button, and its
# label is the sheet library's own default rather than app copy — @gorhom/
# bottom-sheet `components/bottomSheetBackdrop/constants.ts`,
# `DEFAULT_ACCESSIBILITY_LABEL = 'Bottom sheet backdrop'`, which this app does
# not override. The tap then names the button by
# id, so if that id were ever missing from the hierarchy the flow fails with
# "element not found: branching-announcement-continue" — a diagnosis, not a
# mystery.
- extendedWaitUntil:
    visible: 'Bottom sheet backdrop'
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: 'Bottom sheet backdrop'
    commands:
      - tapOn:
          id: 'branching-announcement-continue'
      # Post-condition for the tap, and it covers the dismiss animation. The tap
      # itself reports success either way (green taps prove only that a touch was
      # dispatched), so the backdrop going away is the only evidence the sheet
      # actually closed.
      - extendedWaitUntil:
          notVisible: 'Bottom sheet backdrop'
          timeout: 10000

# Unconditional, and it runs on BOTH branches. In the absent branch there was
# never a backdrop and this costs nothing; in the present branch the block above
# already proved it gone. Its job is the third case: a sheet that turns up after
# the guard has been evaluated. Without this line that sheet would swallow the
# `streak-continue-button` tap below and the flow would fail later, somewhere
# confusing. With it, the flow fails here and names the occluder.
- assertNotVisible: 'Bottom sheet backdrop'

# Now the streak screen is actually reachable.
- tapOn:
    id: 'streak-continue-button'
- waitForAnimationToEnd

# =============================================================================
# QUEST COMPLETION SCREEN
# =============================================================================
# Dismissing the streak screen calls setShouldShowStreakCelebration(false)
# (streak-celebration.tsx:207), the resolver drops to its quest-result branch
# and NavigationGate routes to /(app)/quest/[id] — the authenticated
# equivalent of onboarding's first-quest-result (navigation-gate.tsx:59-61).
# So this wait is also the post-condition for the tap above.
#
# `quest-complete-header` is the OUTCOME assertion, not just a screen anchor:
# the failure branch of quest/[id].tsx renders `FailedQuest`, which shares no
# testID with `QuestComplete`. If the quest failed — which is exactly what an
# unlock inside the 60–120s two-clock gap produces — this wait is what fails,
# with no dependence on copy.
- extendedWaitUntil:
    visible:
      id: 'quest-complete-header'
    timeout: 30000

# The quest that completed is the one part 1 chose. Without this, a run where
# the drag committed the LEFT branch would still show a perfectly valid
# completion screen with identical badges (both branches are 9 XP / 2 min) and
# nothing would notice.
- assertVisible: '.*Searching the Forest for Signs of Life.*'

# Exact reward values, all traceable to checked-in data — a reward or duration
# change should fail this flow rather than pass quietly. All three come from one
# row, `QuestComplete.tsx:74-79`:
#
#     <Badge tone="warm">{`+${adjustedXP} XP`}</Badge>
#     <Badge tone="neutral">{`${quest.durationMinutes} min offline`}</Badge>
#     {questDate && <Badge tone="neutral">{questDate}</Badge>}
#     {!fromJournal && <Badge tone="success">Complete</Badge>}
#
#   +9 XP        quest-1b's `reward: { xp: calculateRewardFromDuration(3) }`
#                = 3 * 3 (data/quests.ts:96, and the same value on the server's
#                template). Reaches the badge through
#                `getCurrentUserAdjustedXP`, so it is read off the quest record
#                rather than off a constant.
#   2 MIN        the dev-mode story override, rendered from the quest record
#                the timer actually ran against.
#   COMPLETE     the success-tone badge, rendered only when `fromJournal` is
#                false — i.e. only on the post-quest path, not on a journal
#                re-open of the same quest.
# Badge uppercases its own text and iOS reports the transformed string, so
# these are written as the accessibility tree reports them. (Matching turned
# out to be case-INsensitive on Maestro 2.0.10, so the casing is documentation
# rather than the thing that makes them bite; the values are.)
#
# -----------------------------------------------------------------------------
# ALL THREE HAVE NOW BEEN WATCHED FAILING (2026-07-26)
# -----------------------------------------------------------------------------
# Each was driven RED against a real screen while the other two were left
# passing, so each red is attributable to exactly one variable — §2.11a's lesson
# that a mutation moving two things at once proves nothing.
#
#   COMPLETE       Re-opening THIS quest from the journal mounts the identical
#                  `QuestComplete` with `fromJournal=true`. On that screen the XP
#                  and duration badges still assert green and this line returns
#                  `Assertion is false: "COMPLETE" is visible`. So it really does
#                  discriminate the post-quest path from a journal view.
#                  (`QuestCompleteHeader.tsx:79` puts the word in the eyebrow too
#                  — `STORY QUEST · COMPLETE` — but §2.12 matching is full-string,
#                  so this line binds to the Badge alone.)
#   +9 XP         Same string against a different real record goes red:
#                  quest-1's journal detail fails `\+9 XP` and passes
#                  `\+100 XP`, while quest-1b's passes `\+9 XP` and fails
#                  `\+8 XP`. It tracks the persisted reward, not the shape.
#   2 MIN OFFLINE quest-1b's journal detail renders `1 MIN OFFLINE` and fails
#                  this string — the *run* record carries `durationMinutes: 1`
#                  (`quest-run.controller.js:181`) while the *template* this
#                  screen renders carries 2. Same quest, two stored durations,
#                  and the assertion follows whichever one is on screen. That is
#                  SHE-28 surfacing somewhere other than the clock; do not
#                  "reconcile" this to 1 to make some future journal flow pass.
#
# `\+` is kept escaped for portability but is NOT what makes these bite: the
# unescaped `'+9 XP'` matches too on Maestro 2.0.10, so it is not passing a
# `+`-leading pattern to a JVM regex raw. The digit is what discriminates.
# -----------------------------------------------------------------------------
- assertVisible: '\+9 XP'
- assertVisible: '2 MIN OFFLINE'
- assertVisible: 'COMPLETE'

# =============================================================================
# CONTINUE BACK TO HOME
# =============================================================================
# The action stack sits below the fold, under the 300pt art header and the
# story card, and its container is absent from the hierarchy entirely until
# scrolled into view.
- scrollUntilVisible:
    element:
      id: 'quest-actions-container'
    direction: DOWN
    timeout: 15000

# Tap the button, NOT the container. `quest-actions-container` wraps exactly
# one button during onboarding — QuestCompleteActions suppresses the reflection
# button for quest-1 — which is why onboarding-part-2.yaml can tap the
# container itself. That does not hold here: `showReflectionButton` requires a
# questRunId, completed onboarding, and a quest id other than quest-1
# (QuestCompleteActions.tsx:101-105), and all three are true for the second
# quest. Measured here: container [20,792][410,908] wrapping "Add reflection"
# [20,792][410,847] and "Continue" [20,859][410,908] — the container's centre
# is (215, 850), inside the 12pt gap between the two.
#
# "Continue" is the label QuestComplete defaults `continueText` to, and
# quest/[id].tsx passes no override. The other button reads "Add reflection",
# so there is no ambiguity between them under full-string matching.
- tapOn: 'Continue'
- waitForAnimationToEnd

# The post-condition for that tap. handleContinue clears recentCompletedQuest
# and pushes /(app), so the tab bar and the home header come back; a tap that
# landed on "Add reflection" instead would sit on the reflection form and fail
# here.
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 20000

# =============================================================================
# END OF PART 2
# =============================================================================
# Two quests completed (quest-1 + quest-1b), 109 XP, still Level 2, streak 1,
# authenticated, sitting on the home screen with the next story decision armed.
# That is the entry state the rest of phase 03 inherits.
