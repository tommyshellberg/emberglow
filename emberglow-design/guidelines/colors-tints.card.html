<!-- @dsCard group="Colors" viewport="700x170" subtitle="80/60/40/20 tints toward white" name="Color Tints" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-app); color: var(--text-secondary); }
  .grid { display: grid; grid-template-columns: 70px repeat(5, 1fr); gap: 6px; padding: 14px; align-items: center; }
  .lbl { font-size: 12px; }
  .t { height: 34px; border-radius: 8px; border: 1px solid var(--border-hairline); }
  a { color: var(--text-accent); } a:hover { color: var(--ember-sandy-80); }
</style></head><body>
<div class="grid">
  <div class="lbl">Cinnabar</div>
  <div class="t" style="background:#d94928"></div><div class="t" style="background:var(--ember-cinnabar-80)"></div><div class="t" style="background:var(--ember-cinnabar-60)"></div><div class="t" style="background:var(--ember-cinnabar-40)"></div><div class="t" style="background:var(--ember-cinnabar-20)"></div>
  <div class="lbl">Sandy</div>
  <div class="t" style="background:#f7a44b"></div><div class="t" style="background:var(--ember-sandy-80)"></div><div class="t" style="background:var(--ember-sandy-60)"></div><div class="t" style="background:var(--ember-sandy-40)"></div><div class="t" style="background:var(--ember-sandy-20)"></div>
  <div class="lbl">Aegean</div>
  <div class="t" style="background:#2c456b"></div><div class="t" style="background:var(--ember-aegean-80)"></div><div class="t" style="background:var(--ember-aegean-60)"></div><div class="t" style="background:var(--ember-aegean-40)"></div><div class="t" style="background:var(--ember-aegean-20)"></div>
</div>
</body></html>
