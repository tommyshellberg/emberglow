<!-- @dsCard group="Spacing" viewport="700x160" subtitle="Rounding: 8 / 12 / 16 / 24 / pill" name="Corner Radii" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-app); color: var(--text-muted); padding: 18px 24px; box-sizing: border-box; }
  .row { display: flex; gap: 14px; align-items: center; }
  .r { width: 96px; height: 76px; background: var(--surface-raised); border: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--text-secondary); }
  a { color: var(--text-accent); } a:hover { color: var(--ember-sandy-80); }
</style></head><body>
<div class="row">
  <div class="r" style="border-radius: var(--radius-sm)">sm · 8</div>
  <div class="r" style="border-radius: var(--radius-md)">md · 12</div>
  <div class="r" style="border-radius: var(--radius-lg)">lg · 16</div>
  <div class="r" style="border-radius: var(--radius-xl)">xl · 24</div>
  <div class="r" style="border-radius: var(--radius-pill); height: 52px;">pill</div>
</div>
</body></html>
