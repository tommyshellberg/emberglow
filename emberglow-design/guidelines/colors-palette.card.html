<!-- @dsCard group="Colors" viewport="700x150" subtitle="The six brand colors from the 2025 guide" name="Brand Palette" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-app); }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; padding: 12px; }
  .sw { height: 96px; border-radius: var(--radius-md); border: 1px solid var(--border-hairline); padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; }
  .sw b { font-size: 13px; font-weight: 600; }
  .sw span { font-size: 11px; opacity: 0.75; }
  a { color: var(--text-accent); } a:hover { color: var(--ember-sandy-80); }
</style></head><body>
<div class="row">
  <div class="sw" style="background: var(--ember-rich-black); color: var(--ember-bone);"><b>Rich Black</b><span>#00121b</span></div>
  <div class="sw" style="background: var(--ember-midnight); color: var(--ember-bone);"><b>Midnight Blue</b><span>#162034</span></div>
  <div class="sw" style="background: var(--ember-aegean); color: var(--ember-bone);"><b>Aegean Blue</b><span>#2c456b</span></div>
  <div class="sw" style="background: var(--ember-cinnabar); color: #fdf6ea;"><b>Cinnabar</b><span>#d94928</span></div>
  <div class="sw" style="background: var(--ember-sandy); color: #3a2410;"><b>Sandy Brown</b><span>#f7a44b</span></div>
  <div class="sw" style="background: var(--ember-bone); color: #16202f;"><b>Bone</b><span>#e8dcc7</span></div>
</div>
</body></html>
