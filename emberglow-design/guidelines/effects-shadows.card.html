<!-- @dsCard group="Spacing" viewport="700x210" subtitle="Elevation shadows and warm ember glows" name="Shadow & Glow" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-raised); color: var(--text-muted); padding: 24px; box-sizing: border-box; }
  .row { display: flex; gap: 18px; }
  .b { flex: 1; height: 110px; border-radius: var(--radius-lg); background: var(--surface-app); border: 1px solid var(--border-hairline); display: flex; align-items: flex-end; padding: 12px; box-sizing: border-box; font-size: 12px; color: var(--text-secondary); }
  a { color: var(--text-accent); } a:hover { color: var(--ember-sandy-80); }
</style></head><body>
<div class="row">
  <div class="b" style="box-shadow: var(--shadow-raised)">shadow-raised</div>
  <div class="b" style="box-shadow: var(--shadow-card)">shadow-card</div>
  <div class="b" style="box-shadow: var(--glow-ember); border-color: rgba(217,73,40,0.4)">glow-ember</div>
  <div class="b" style="box-shadow: var(--glow-warm); border-color: rgba(247,164,75,0.4)">glow-warm</div>
</div>
</body></html>
