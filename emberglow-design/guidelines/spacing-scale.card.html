<!-- @dsCard group="Spacing" viewport="700x160" subtitle="4px base scale" name="Spacing Tokens" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-app); color: var(--text-muted); padding: 18px 24px; box-sizing: border-box; }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; }
  .bar { width: 26px; background: var(--ember-aegean); border-radius: 4px 4px 0 0; border-top: 2px solid var(--ember-sandy); }
  a { color: var(--text-accent); } a:hover { color: var(--ember-sandy-80); }
</style></head><body>
<div class="row">
  <div class="item"><div class="bar" style="height:4px"></div>4</div>
  <div class="item"><div class="bar" style="height:8px"></div>8</div>
  <div class="item"><div class="bar" style="height:12px"></div>12</div>
  <div class="item"><div class="bar" style="height:16px"></div>16</div>
  <div class="item"><div class="bar" style="height:20px"></div>20</div>
  <div class="item"><div class="bar" style="height:24px"></div>24</div>
  <div class="item"><div class="bar" style="height:32px"></div>32</div>
  <div class="item"><div class="bar" style="height:40px"></div>40</div>
  <div class="item"><div class="bar" style="height:48px"></div>48</div>
  <div class="item"><div class="bar" style="height:64px"></div>64</div>
</div>
</body></html>
