<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-app); color: var(--text-primary); padding: 22px 24px; box-sizing: border-box; text-align: center; }
  .eyebrow { font-size: 13px; font-weight: var(--weight-semibold); letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--ember-cinnabar-80); margin-bottom: 10px; }
  h1 { font-family: var(--font-display); font-weight: 400; font-size: var(--text-h1); line-height: var(--leading-display); margin: 0 0 10px; }
  p { font-size: var(--text-body-lg); line-height: var(--leading-body); color: var(--text-secondary); margin: 0 auto; max-width: 34ch; }
  a { color: var(--text-accent); } a:hover { color: var(--ember-sandy-80); }
</style></head><body>
<div class="eyebrow">Quest in progress</div>
<h1>Collecting Firewood</h1>
<p>The forest darkens. You gather what you can before night falls.</p>
</body></html>
