<!-- @dsCard group="Type" viewport="700x170" subtitle="ALL-CAPS letterspaced labels — the signature eyebrow" name="Eyebrow Labels" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-app); color: var(--text-primary); padding: 22px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; }
  .eyebrow { font-size: 13px; font-weight: var(--weight-semibold); letter-spacing: var(--tracking-label); text-transform: uppercase; }
  .meta { font-size: 12px; color: var(--text-muted); }
  a { color: var(--text-accent); } a:hover { color: var(--ember-sandy-80); }
</style></head><body>
<div class="eyebrow" style="color: var(--ember-cinnabar-80);">Quest in progress</div>
<div class="eyebrow" style="color: var(--text-accent);">Of 15:00</div>
<div class="eyebrow" style="color: var(--text-muted);">06 · Active quest</div>
<div class="meta">Source Sans 3 semibold · 12–13px · 0.22em tracking · Cinnabar for state, Sandy for values, muted for footers</div>
</body></html>
